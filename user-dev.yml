server:
  port: 9001

spring:
  application:
    name: myshop-user
  datasource:
    url: jdbc:mysql://localhost:3307/springcloud?characterEncoding=UTF8&useSSL=false
    driver-class-name: com.mysql.jdbc.Driver

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8888/eureka
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

